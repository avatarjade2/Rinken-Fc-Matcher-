<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline'; frame-src 'self' https: data:;">
    <title>Rinken FC - Officiellt Matchcenter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-area">
                <div class="club-logo">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#e11d48"/>
                        <text x="50" y="62" font-size="55" font-weight="900" text-anchor="middle" fill="white" font-family="system-ui">R</text>
                    </svg>
                </div>
                <div class="logo-text">
                    <div class="logo-main">Rinken FC</div>
                    <div class="logo-sub">Match Center</div>
                </div>
            </div>
            <div class="header-status" id="system-status" role="status" aria-live="polite">
                <span class="pulse" id="status-pulse"></span>
                <span id="status-text">Laddar...</span>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-section reveal-scale" id="hem">
            <div class="hero-content">
                <h1 class="hero-title">Följ <span class="text-gradient">Rinken FC</span><br>i <span class="accent-text">realtid</span></h1>
            </div>
            <div class="lag-selector reveal-up">
                <button class="nav-btn" onclick="forraLag()" aria-label="Föregående lag">←</button>
                <div class="lag-display">
                    <div class="lag-label">Nuvarande lag</div>
                    <div class="lag-namn" id="lag-namn">Laddar...</div>
                </div>
                <button class="nav-btn" onclick="nastaLag()" aria-label="Nästa lag">→</button>
            </div>
        </section>

        <section class="bento-grid" id="matcher">
            <!-- Match Widget -->
            <div class="bento-card widget-card reveal-up">
                <div class="card-header">
                    <h2>Senaste Resultaten</h2>
                </div>
                <div class="widget-styled">
                    <div class="widget-box">
                        <iframe id="match-widget" title="Match widget för aktuell lag" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-presentation" loading="lazy"></iframe>
                    </div>
                </div>
            </div>

            <!-- Instagram Widget -->
            <div class="bento-card instagram-card reveal-up">
                <div class="card-header">
                    <h2>Senaste från Instagram</h2>
                </div>
                <div class="instagram-styled">
                    <div class="instagram-box" id="instagram-container">
                        <p style="text-align: center; color: #64748b;">Laddar Instagram...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Instagram Embed Script -->
    <script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
