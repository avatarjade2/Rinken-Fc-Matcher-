<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Rinken FC - Matchcenter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo-main">Rinken FC</div>
        <nav class="nav-menu">
            <a href="#hem">Hem</a>
            <a href="#om">Om oss</a>
        </nav>
    </header>

    <main>
        <section id="hem" class="hero-section">
            <h1>Följ <span style="color:var(--brand-red)">Rinken FC</span></h1>
            <div class="lag-selector">
                <button class="nav-btn" onclick="forraLag()">←</button>
                <div id="lag-namn">Laddar...</div>
                <button class="nav-btn" onclick="nastaLag()">→</button>
            </div>
        </section>

        <section class="bento-card">
            <h2>Senaste matcher</h2>
            <div class="widget-box">
                <iframe id="match-widget"></iframe>
            </div>
        </section>

        <section id="om" class="bento-card" style="margin-top:20px;">
            <h2>Om oss</h2>
            <p>Rinken FC – gemenskap och fotbollsglädje i Kristianstad.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Rinken FC</p>
        <div class="social-links">
            <a href="https://instagram.com/dittkonto">Följ oss på Instagram</a>
        </div>
    </footer>
</body>
</html>
