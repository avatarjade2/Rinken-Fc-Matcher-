<!DOCTYPE html>
<html lang="sv"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval';">
    <title>Rinken FC - Officiellt Matchcenter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body> 
    <!-- Glassmorphism Header -->
    <header>
        <div class="header-content">
            <div class="logo-area">
                <div class="club-logo-placeholder">RFC</div>
                <div class="logo-text">Rinken FC</div>
            </div>
            <div class="header-status"><span class="pulse"></span> Live Center</div>
        </div>
    </header>

    <main>
        <!-- Hero Sektion -->
        <section class="hero-section reveal-scale">
            <h1 class="hero-title">Officiellt<br><span class="text-gradient">Matchcenter</span></h1>
            
            <div class="lag-styre">
                <button class="nav-btn" onclick="forraLag()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="lag-titel-display" id="lag-namn">-</div>
                <button class="nav-btn" onclick="nastaLag()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </section>

        <!-- Bento Grid Sektion -->
        <section class="bento-grid">
            <!-- Stor Huvudpanel (Widget) -->
            <div class="bento-card widget-card reveal-up" style="--delay: 0.1s">
                <div class="card-header">
                    <span class="badge">Tabell & Resultat</span>
                </div>
                <div class="widget-box">
                    <iframe id="match-widget" src=""></iframe>
                </div>
            </div>

            <!-- Mindre kort staplade till höger -->
            <div class="bento-sidebar">
                
                <div class="bento-card highlight-card reveal-up" style="--delay: 0.2s">
                    <div class="card-header">
                        <span class="badge badge-red">Nästa Match</span>
                    </div>
                    <div class="match-info-large" id="match-aktuella-lag">Laddar...</div>
                    <div class="match-time-sub" id="match-klockslag">-</div>
                    
                    <div class="countdown-wrapper">
                        <div class="cd-label" id="countdown-rubrik">Nedräkning</div>
                        <div class="cd-clock" id="countdown-display">00:00:00:00</div>
                    </div>
                </div>

                <div class="bento-card location-card reveal-up" style="--delay: 0.3s">
                    <div class="location-header">
                        <div>
                            <h3>Grönevi IP</h3>
                            <p class="sub-text">Näsby, Kristianstad</p>
                        </div>
                        <div class="weather-pill" id="weather-data">--°C</div>
                    </div>
                    <div class="map-box">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2238.164344155167!2d14.162758177309995!3d56.05051991834606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4654035626eb45bb%3A0xc6cb697e07663e8a!2sGr%C3%B6nevi%20Idrottsplats!5e0!3m2!1ssv!2sse!4v1716675000000!5m2!1ssv!2sse" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
